<style>

  header .logo { width: 68px; height: 68px; flex-shrink: 0; }

  }

  nav {
    display: flex; overflow-x: auto; background: var(--fairway-light);
    padding: 0 12px; gap: 2px;
  }
  nav button {
    background: none; border: none; color: #DCEEE1; padding: 11px 14px;

    border-bottom: 3px solid transparent; font-family: inherit;
  }
  nav button.active { color: #fff; border-bottom-color: var(--clay); font-weight: 600; }

  main { padding: 16px; max-width: 720px; margin: 0 auto; padding-bottom: 60px; }

  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;

  }
  .card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }

  label { display: block; font-size: 12px; color: #7A7264; margin-bottom: 4px; font-weight: 500; }
  input, select {
    width: 100%; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--line);

  .row { display: flex; gap: 10px; margin-bottom: 10px; }

  button.primary {

  button.secondary {

  table.scorecard td.name { text-align: left; padding-left: 8px; font-weight: 600; white-space: nowrap; }

  table.scorecard input:focus { outline: 2px solid var(--fairway-light); background: #fff; }
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }

  .leader-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;

  .leader-row:last-child { border-bottom: none; }
  .leader-pos {

  /* Tabla general */
  .tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
  table.tg { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  table.tg th, table.tg td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }

  /* Inicio */
  .hero { text-align: center; padding: 22px 18px 20px; background: #F9F0DF; }
  .hero img { width: 170px; height: 170px; display: block; margin: 0 auto 8px; }
  .hero h2 { margin: 0; font-size: 26px; color: var(--fairway); font-weight: 700; }
  .hero .fechas { margin: 4px 0 12px; color: var(--clay); font-weight: 600; font-size: 13.5px; }
  .hero p.bienv { margin: 0 auto; max-width: 480px; font-size: 14px; line-height: 1.55; color: #4A4F45; }
  .sec-titulo { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: var(--fairway); margin: 22px 2px 10px; }
  .dia-card { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; }
  .dia-card:hover { border-color: var(--moss); }
  .dia-fecha { flex-shrink: 0; width: 58px; text-align: center; background: var(--fairway); color: #F5F0E3; border-radius: 9px; padding: 8px 0 7px; }
  .dia-fecha .dnum { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 700; line-height: 1; }
  .dia-fecha .dmes { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }
  .dia-fecha .dsem { font-size: 10px; opacity: 0.75; margin-top: 1px; }
  .dia-info { flex: 1; min-width: 0; }
  .dia-info .dlabel { font-size: 11px; font-weight: 700; color: var(--clay); text-transform: uppercase; letter-spacing: 0.04em; }
  .dia-info .dcampo { font-family: 'Fraunces', serif; font-size: 16.5px; font-weight: 600; margin: 1px 0 6px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; margin: 0 4px 4px 0; }
  .tag.fmt { background: #E8F0E9; color: var(--fairway); }
  .tag.par { background: #F0EBDC; color: #6B5E45; }
  .tag.x2 { background: var(--clay); color: #fff; }
  .dia-info .ddesc { font-size: 12.5px; color: #6E685C; line-height: 1.45; margin-top: 4px; }
  .jug-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .jug-item { display: flex; align-items: center; gap: 9px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; }
  .jug-item .ini { width: 32px; height: 32px; border-radius: 50%; background: #F0EBDC; color: var(--fairway); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .jug-item .nom { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .jug-item .apodo { font-size: 11px; color: var(--clay); }
  .formato-lista { margin: 0; padding: 0; list-style: none; }
  .formato-lista li { padding: 9px 0; border-top: 1px solid #EEE8D9; font-size: 13px; line-height: 1.45; color: #4A4F45; }
  .formato-lista li:first-child { border-top: none; padding-top: 0; }
  .formato-lista b { color: var(--fairway); }
  .cta { display: block; width: 100%; margin-top: 6px; }

  .day-summary-pill {
    display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px;
    background: #E8F0E9; color: var(--fairway); font-weight: 600; margin-bottom: 10px;
  }
  .format-pill {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--moss);
  }

  .player-chip {
    display: inline-flex; align-items: center; gap: 6px; background: #F0EBDC;
    border-radius: 20px; padding: 6px 10px 6px 6px; font-size: 12.5px; margin: 3px;
  }
  .player-chip .x { cursor: pointer; color: #B65530; font-weight: 700; padding: 0 3px; }

  .empty-state { text-align: center; padding: 40px 20px; color: #9A927F; font-size: 13.5px; }

  .toast {
    position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 9px 18px; border-radius: 20px; font-size: 12.5px; opacity: 0;
    transition: opacity 0.25s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <img class="logo" src="logo.png" alt="Phoenix Open">
  <div class="titulos">
    <h1 class="serif">Phoenix Open 2026</h1>
    <p id="subtitulo">3 días · 3 campos · 12 jugadores</p>
  </div>
  <button class="admin-btn" id="admin-btn" onclick="clickAdmin()">Admin</button>
</header>

<nav id="nav"></nav>
<main id="main"><div class="empty-state">Cargando...</div></main>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://xnrcrruvbwoeorbltumv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhucmNycnV2YndvZW9yYmx0dW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTA2NTAsImV4cCI6MjEwNTc2NjY1MH0.HXtWz-2aYqAeaiIjvCiavFiF0X6TL3sUG7OUhbR-mfc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let jugadores = [];
let dias = [];
let scoresRows = [];
let handicapsRows = [];
let parejasRows = [];
let tab = null;
let esAdmin = false;

const FORMATOS = { stableford: 'Stableford', net: 'Stroke Play (neto)', skins: 'Skins' };
const DESC_FORMATO = {
  stableford: 'Puntos por hoyo contra el par con tu hándicap: bogey 1, par 2, birdie 3, águila 4. Gana quien sume más.',
  net: 'Golpes totales menos tu hándicap del día. Gana el score neto más bajo.',
  skins: 'Hoyo por hoyo dentro de tu foursome: el mejor neto sin empate se lleva el skin. Gana quien junte más skins.',
};
// Apodos (solo para mostrar)
const APODOS = {
  'Alejandro Aceves': 'Chapo',
  'Juan Pablo Franco': 'Papo',
  'Jorge Carrera': 'Carrera',
  'Gabriel Camou': 'Camou',
};
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const SEMANA = ['dom','lun','mar','mié','jue','vie','sáb'];
function partesFecha(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  const f = new Date(y, m - 1, d);
  return { dia: d, mes: MESES[m - 1], sem: SEMANA[f.getDay()] };
}

// ---------- Sistema de puntos ----------
// Puntos por lugar en el individual (1° a 12°). Empates: se promedian los lugares.
const PUNTOS_LUGAR = [100, 90, 82, 75, 68, 62, 56, 50, 45, 40, 35, 30];
// Match de parejas (a cada jugador de la pareja)
const PUNTOS_PAREJA = { gana: 25, empate: 12.5, pierde: 0 };
// El último día vale doble
function multiplicadorDia(dia) {
  const idx = dias.findIndex(d => d.id === dia.id);
  return idx === dias.length - 1 ? 2 : 1;
}
function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function scoresDe(diaId, jugadorId) {
  const row = scoresRows.find(r => r.dia_id === diaId && r.jugador_id === jugadorId);
  return row ? row.scores : Array(18).fill(null);
}

function handicapDe(diaId, jugadorId) {
  const row = handicapsRows.find(r => r.dia_id === diaId && r.jugador_id === jugadorId);
  if (row) return row.handicap;
  const jug = jugadores.find(j => j.id === jugadorId);
  return jug ? (jug.handicap || 0) : 0; // fallback al hándicap general si no se capturó el de este día
}

async function cargarTodo() {
  const [{ data: j }, { data: d }, { data: s }, { data: h }, { data: p }] = await Promise.all([
    sb.from('jugadores').select('*').order('nombre'),
    sb.from('dias').select('*').order('orden'),
    sb.from('scores').select('*'),
    sb.from('handicaps').select('*'),
    sb.from('parejas_dia').select('*').order('grupo_idx'),
  ]);
  jugadores = j || [];
  dias = d || [];
  scoresRows = s || [];
  handicapsRows = h || [];
  parejasRows = p || [];
  render();
}

function suscribirRealtime() {
  sb.channel('viaje-golf-cambios')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'jugadores' }, cargarTodo)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'dias' }, cargarTodo)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'scores' }, cargarTodo)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'handicaps' }, cargarTodo)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'parejas_dia' }, cargarTodo)
    .subscribe();
}

function strokesEnHoyo(handicap, strokeIndex) {
  const base = Math.floor(handicap / 18);
  const extra = (strokeIndex <= (handicap % 18)) ? 1 : 0;
  return base + extra;
}

function stablefordPts(netScore, par) {
  const dif = netScore - par;
  if (dif <= -3) return 5;
  if (dif === -2) return 4;
  if (dif === -1) return 3;
  if (dif === 0) return 2;
  if (dif === 1) return 1;
  return 0;
}

function calcularResultadoDia(dia) {
  const jugadoresDia = dia.foursomes.flat().filter(Boolean);
  const resultado = {};
  let mejorEsMenor = false;

  if (dia.formato === 'net') {
    mejorEsMenor = true;
    jugadoresDia.forEach(jid => {
      const jug = jugadores.find(j => j.id === jid);
      const sc = scoresDe(dia.id, jid);
      if (!jug || sc.some(s => s === null || s === undefined)) return;
      const totalBruto = sc.reduce((a, b) => a + b, 0);
      resultado[jid] = totalBruto - handicapDe(dia.id, jid);
    });
  } else if (dia.formato === 'stableford') {
    mejorEsMenor = false;
    jugadoresDia.forEach(jid => {
      const jug = jugadores.find(j => j.id === jid);
      const sc = scoresDe(dia.id, jid);
      if (!jug || sc.some(s => s === null || s === undefined)) return;
      let pts = 0;
      for (let h = 0; h < 18; h++) {
        const strokes = strokesEnHoyo(handicapDe(dia.id, jid), dia.stroke_index[h]);
        const neto = sc[h] - strokes;
        pts += stablefordPts(neto, dia.pares[h]);
      }
      resultado[jid] = pts;
    });
  } else if (dia.formato === 'skins') {
    mejorEsMenor = false;
    dia.foursomes.forEach(grupo => {
      const jugadoresGrupo = grupo.filter(Boolean);
      if (jugadoresGrupo.length < 2) return;
      jugadoresGrupo.forEach(jid => { resultado[jid] = 0; });
      for (let h = 0; h < 18; h++) {
        let mejorNeto = Infinity, ganador = null, empatados = 0;
        jugadoresGrupo.forEach(jid => {
          const jug = jugadores.find(j => j.id === jid);
          const sc = scoresDe(dia.id, jid);
          if (!jug || sc[h] === null || sc[h] === undefined) return;
          const strokes = strokesEnHoyo(handicapDe(dia.id, jid), dia.stroke_index[h]);
          const neto = sc[h] - strokes;
          if (neto < mejorNeto) { mejorNeto = neto; ganador = jid; empatados = 1; }
          else if (neto === mejorNeto) { empatados++; }
        });
        if (ganador && empatados === 1) resultado[ganador]++;
      }
    });
    jugadoresDia.forEach(jid => {
      const sc = scoresDe(dia.id, jid);
      if (sc.some(s => s === null || s === undefined)) delete resultado[jid];
    });
  }

  return { resultado, mejorEsMenor };
}

function puntosDelDia(dia) {
  const { resultado, mejorEsMenor } = calcularResultadoDia(dia);
  const entries = Object.entries(resultado);
  if (entries.length === 0) return {};
  entries.sort((a, b) => mejorEsMenor ? a[1] - b[1] : b[1] - a[1]);
  const puntos = {};
  let i = 0;
  while (i < entries.length) {
    let j = i;
    while (j + 1 < entries.length && entries[j + 1][1] === entries[i][1]) j++;
    const rangoPts = [];
    for (let k = i; k <= j; k++) rangoPts.push(PUNTOS_LUGAR[k] ?? 0);
    const promedio = rangoPts.reduce((a, b) => a + b, 0) / rangoPts.length;
    for (let k = i; k <= j; k++) puntos[entries[k][0]] = promedio * multiplicadorDia(dia);
    i = j + 1;
  }
  return puntos;
}

function puntosParejasDelDia(dia) {
  const m = multiplicadorDia(dia);
  const puntos = {};
  parejasRows.filter(p => p.dia_id === dia.id && p.ganador).forEach(p => {
    const a = p.pareja_a || [], b = p.pareja_b || [];
    let pa = 0, pb = 0;
    if (p.ganador === 'a') { pa = PUNTOS_PAREJA.gana; pb = PUNTOS_PAREJA.pierde; }
    else if (p.ganador === 'b') { pa = PUNTOS_PAREJA.pierde; pb = PUNTOS_PAREJA.gana; }
    else if (p.ganador === 'empate') { pa = pb = PUNTOS_PAREJA.empate; }
    a.forEach(jid => { puntos[jid] = (puntos[jid] || 0) + pa * m; });
    b.forEach(jid => { puntos[jid] = (puntos[jid] || 0) + pb * m; });
  });
  return puntos;
}

function tablaGeneral() {
  const totales = {};
  jugadores.forEach(j => { totales[j.id] = { nombre: j.nombre, total: 0, detalle: [], ultimoDia: 0 }; });
  dias.forEach((dia, idx) => {
    const ind = puntosDelDia(dia);
    const par = puntosParejasDelDia(dia);
    jugadores.forEach(j => {
      const pi = (j.id in ind) ? ind[j.id] : null;
      const pp = (j.id in par) ? par[j.id] : null;
      totales[j.id].total += (pi || 0) + (pp || 0);
      totales[j.id].detalle.push({ ind: pi, par: pp });
      if (idx === dias.length - 1) totales[j.id].ultimoDia = (pi || 0) + (pp || 0);
    });
  });
  // Desempate: mejor resultado del último día
  return Object.values(totales).sort((a, b) => (b.total - a.total) || (b.ultimoDia - a.ultimoDia));
}

function render() {
  document.getElementById('subtitulo').textContent = `Scottsdale · ${dias.length} días · ${jugadores.length} jugadores`;

  const navEl = document.getElementById('nav');
  document.getElementById('admin-btn').textContent = esAdmin ? 'Salir' : 'Admin';

  // Solo el admin ve y puede abrir Configuración
  if (!tab || (tab === 'config' && !esAdmin)) tab = 'inicio';

  const tabs = [
    { id: 'inicio', label: 'Inicio' },
    ...dias.map((d, i) => ({ id: d.id, label: `Día ${i + 1}` })),
    { id: 'tabla', label: 'Tabla General' },
    ...(esAdmin ? [{ id: 'config', label: 'Configuración' }] : []),
  ];
  navEl.innerHTML = tabs.map(t =>
    `<button class="${tab === t.id ? 'active' : ''}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join('');

  const main = document.getElementById('main');
  main.classList.toggle('ancho', tab === 'tabla');
  if (tab === 'inicio') main.innerHTML = renderInicio();
  else if (tab === 'login') main.innerHTML = renderLogin();
  else if (tab === 'config' && esAdmin) main.innerHTML = renderConfig();
  else if (tab === 'tabla') main.innerHTML = renderTabla();
  else main.innerHTML = renderDia(dias.find(d => d.id === tab));
}

function setTab(t) { tab = t; render(); window.scrollTo(0, 0); }

// ---------- Inicio ----------
function renderInicio() {
  const f1 = partesFecha(dias[0]?.fecha), fN = partesFecha(dias[dias.length - 1]?.fecha);
  const rango = f1 && fN
    ? (f1.mes === fN.mes ? `${f1.dia} al ${fN.dia} de ${fN.mes}` : `${f1.dia} ${f1.mes} al ${fN.dia} ${fN.mes}`) + ' · Scottsdale, AZ'
    : 'Scottsdale, AZ';
  const iniciales = n => n.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();

  const cardsDias = dias.map((d, i) => {
    const f = partesFecha(d.fecha);
    return `<div class="card dia-card" onclick="setTab('${d.id}')">
      <div class="dia-fecha">
        ${f ? `<div class="dnum">${f.dia}</div><div class="dmes">${f.mes}</div><div class="dsem">${f.sem}</div>` : `<div class="dnum">${i + 1}</div>`}
      </div>
      <div class="dia-info">
        <div class="dlabel">Día ${i + 1}</div>
        <div class="dcampo">${d.campo || 'Campo por definir'}</div>
        <span class="tag fmt">${FORMATOS[d.formato] || ''}</span>
        <span class="tag par">Match de parejas</span>
        ${multiplicadorDia(d) === 2 ? '<span class="tag x2">Puntos dobles</span>' : ''}
        <div class="ddesc">${DESC_FORMATO[d.formato] || ''}</div>
      </div>
    </div>`;
  }).join('');

  const listaJug = jugadores.map(j => `
    <div class="jug-item">
      <div class="ini">${iniciales(j.nombre)}</div>
      <div><div class="nom">${j.nombre}</div>${APODOS[j.nombre] ? `<div class="apodo">"${APODOS[j.nombre]}"</div>` : ''}</div>
    </div>`).join('');

  return `
  <div class="card hero">
    <img src="logo.png" alt="Phoenix Open">
    <h2 class="serif">Bienvenidos al Phoenix Open 2026</h2>
    <div class="fechas">${rango}</div>
    <p class="bienv">${jugadores.length} jugadores, ${dias.length} días y ${dias.length} de los mejores campos del desierto de Arizona. Cada día se juega individual y en parejas, y todo suma para un solo campeón. Nadie está fuera hasta el último hoyo: el día final vale doble.</p>
  </div>

  <div class="sec-titulo">Los campos</div>
  ${cardsDias}

  <div class="sec-titulo">Cómo se juega</div>
  <div class="card">
    <ul class="formato-lista">
      <li><b>Torneo individual.</b> Cada día se juega un formato distinto con hándicap. Según tu lugar del día sumas puntos: 1° = 100, 2° = 90… hasta 12° = 30.</li>
      <li><b>Match de parejas.</b> Dentro de cada foursome se juega 2 vs 2, bola baja y bola alta con hándicap. Las parejas cambian cada día y nunca se repiten. Ganar suma 25 puntos a cada jugador.</li>
      <li><b>El último día vale doble.</b> Todos llegan con chance al final.</li>
      <li><b>Un solo campeón:</b> el que más puntos junte en los ${dias.length} días.</li>
    </ul>
    <button class="secondary cta" onclick="setTab('tabla')">Ver Tabla General</button>
  </div>

  <div class="sec-titulo">Los jugadores</div>
  <div class="jug-grid">${listaJug}</div>
  `;
}
window.setTab = setTab;

// ---------- Acceso admin ----------
function renderLogin() {
  return `<div class="card">
    <h3>Acceso admin</h3>
    <p class="muted" style="margin:0 0 12px;">Solo el organizador puede entrar a Configuración.</p>
    <div class="row"><div><label>Correo</label><input id="login-email" type="email" autocomplete="username" /></div></div>
    <div class="row"><div><label>Contraseña</label><input id="login-pass" type="password" autocomplete="current-password" /></div></div>
    <button class="primary" onclick="entrarAdmin()" style="width:100%;">Entrar</button>
  </div>`;
}

async function clickAdmin() {
  if (esAdmin) {
    await sb.auth.signOut();
    toast('Sesión cerrada');
    return;
  }
  tab = 'login';
  render();
}
window.clickAdmin = clickAdmin;

async function entrarAdmin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { toast('Correo o contraseña incorrectos'); return; }
  tab = 'config';
  toast('Bienvenido');
}
window.entrarAdmin = entrarAdmin;

sb.auth.onAuthStateChange((_evento, session) => {
  esAdmin = !!session;
  if (!esAdmin && (tab === 'config')) tab = null;
  render();
});

function renderConfig() {
  let html = `<div class="card">
    <h3>Jugadores <span class="muted">(${jugadores.length}/12)</span></h3>
    <div style="margin: 10px 0;">
      ${jugadores.map(j => `
        <span class="player-chip">${j.nombre}
          <span class="x" onclick="quitarJugador('${j.id}')">✕</span>
        </span>
      `).join('')}
    </div>
    <div class="row">
      <div style="flex:2"><label>Nombre</label><input id="nuevo-nombre" placeholder="Nombre del jugador" /></div>
    </div>
    <button class="secondary" onclick="agregarJugador()">+ Agregar jugador</button>
  </div>`;

  dias.forEach((dia, i) => {
    html += `<div class="card">
      <h3>Día ${i + 1}</h3>
      <div class="row">
        <div><label>Fecha</label><input type="date" value="${dia.fecha || ''}" onchange="actualizarDia('${dia.id}','fecha',this.value)" /></div>
        <div><label>Campo</label><input value="${dia.campo || ''}" placeholder="Nombre del campo" onchange="actualizarDia('${dia.id}','campo',this.value)" /></div>
      </div>
      <label>Formato de juego</label>
      <select onchange="actualizarDia('${dia.id}','formato',this.value)">
        ${Object.entries(FORMATOS).map(([k, v]) => `<option value="${k}" ${dia.formato === k ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
      <div style="margin-top:12px;">
        <label>Foursomes</label>
        ${dia.foursomes.map((grupo, gi) => `
          <div class="foursome-tag">Grupo ${gi + 1}</div>
          <div class="row" style="flex-wrap:wrap; margin-bottom:8px;">
            ${[0,1,2,3].map(slot => `
              <select style="flex:1; min-width:120px;" onchange="asignarFoursome('${dia.id}',${gi},${slot},this.value)">
                <option value="">—</option>
                ${jugadores.map(j => `<option value="${j.id}" ${grupo[slot]===j.id?'selected':''}>${j.nombre}</option>`).join('')}
              </select>
            `).join('')}
          </div>
        `).join('')}
      </div>
      <button class="secondary" onclick="toggleParesInput('${dia.id}')" style="margin-top:6px;">Editar par / stroke index de hoyo</button>
      <div id="pares-${dia.id}" style="display:none; margin-top:10px;">
        <div class="scroll-x"><table class="scorecard"><thead><tr><th>Hoyo</th>${Array.from({length:18},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td class="name">Par</td>${dia.pares.map((p,h)=>`<td><input value="${p}" onchange="actualizarArrayDia('${dia.id}','pares',${h},this.value)"/></td>`).join('')}</tr>
          <tr><td class="name">S.I.</td>${dia.stroke_index.map((s,h)=>`<td><input value="${s}" onchange="actualizarArrayDia('${dia.id}','stroke_index',${h},this.value)"/></td>`).join('')}</tr>
        </tbody></table></div>
      </div>
      ${dia.foursomes.flat().filter(Boolean).length > 0 ? `
        <label style="margin-top:14px;">Hándicap de cada jugador en este campo</label>
        ${dia.foursomes.flat().filter(Boolean).map(jid => {
          const jug = jugadores.find(j => j.id === jid);
          if (!jug) return '';
          return `<div class="row" style="align-items:center; margin-bottom:6px;">
            <div style="flex:2; font-size:13px;">${jug.nombre}</div>
            <div style="flex:1;"><input type="number" step="0.1" value="${handicapDe(dia.id, jid)}" onchange="actualizarHandicapDia('${dia.id}','${jid}',this.value)" /></div>
          </div>`;
        }).join('')}
      ` : ''}
    </div>`;
  });

  return html;
}

function renderDia(dia) {
  if (!dia) return '<div class="empty-state">Día no encontrado</div>';
  let html = `<div class="day-summary-pill">${dia.campo || 'Campo sin definir'} ${dia.fecha ? '· ' + dia.fecha : ''}</div>
    <div class="format-pill" style="margin-bottom:14px;">Formato: ${FORMATOS[dia.formato]}${multiplicadorDia(dia) === 2 ? ' · Puntos dobles' : ''}</div>`;

  dia.foursomes.forEach((grupo, gi) => {
    const jugadoresGrupo = grupo.map(jid => jugadores.find(j => j.id === jid)).filter(Boolean);
    if (jugadoresGrupo.length === 0) return;

    const pareja = parejasRows.find(p => p.dia_id === dia.id && p.grupo_idx === gi);
    let htmlParejas = '';
    if (pareja) {
      const nombreDe = jid => jugadores.find(j => j.id === jid)?.nombre.split(' ')[0] || '?';
      const [a1, a2] = pareja.pareja_a;
      const [b1, b2] = pareja.pareja_b;
      htmlParejas = `
        <div class="foursome-tag" style="color:var(--moss); margin-top:2px;">⛳ Match de parejas (bola baja + bola alta)</div>
        <div class="row" style="align-items:center; margin-bottom:10px;">
          <div style="flex:1; font-size:13.5px; font-weight:600;">${nombreDe(a1)} + ${nombreDe(a2)}</div>
          <div style="font-size:11px; color:#9A927F;">vs</div>
          <div style="flex:1; font-size:13.5px; font-weight:600; text-align:right;">${nombreDe(b1)} + ${nombreDe(b2)}</div>
        </div>
        <select onchange="guardarGanadorPareja('${pareja.id}',this.value)" style="margin-bottom:14px;">
          <option value="" ${!pareja.ganador ? 'selected' : ''}>¿Quién ganó el match?</option>
          <option value="a" ${pareja.ganador==='a'?'selected':''}>Ganó ${nombreDe(a1)} + ${nombreDe(a2)}</option>
          <option value="b" ${pareja.ganador==='b'?'selected':''}>Ganó ${nombreDe(b1)} + ${nombreDe(b2)}</option>
          <option value="empate" ${pareja.ganador==='empate'?'selected':''}>Empate</option>
        </select>`;
    }

    html += `<div class="card">
      <div class="foursome-tag">Grupo ${gi + 1}</div>
      ${htmlParejas}
      <div class="scroll-x">
        <table class="scorecard">
          <thead><tr><th style="text-align:left; padding-left:8px;">Jugador</th>${Array.from({length:18},(_,i)=>`<th>${i+1}</th>`).join('')}<th>Tot</th></tr></thead>
          <tbody>
            ${jugadoresGrupo.map(j => {
              const sc = scoresDe(dia.id, j.id);
              const total = sc.reduce((a,b) => a + (b || 0), 0);
              return `<tr>
                <td class="name">${j.nombre.split(' ')[0]}</td>
                ${sc.map((s, h) => `<td><input type="number" value="${s ?? ''}" onchange="guardarScore('${dia.id}','${j.id}',${h},this.value)" /></td>`).join('')}
                <td style="font-weight:700;">${total || '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  });

  if (dia.foursomes.every(g => g.filter(Boolean).length === 0)) {
    html += '<div class="empty-state">Los foursomes de este día todavía no están definidos.</div>';
  }
  return html;
}

function renderTabla() {
  const tabla = tablaGeneral();
  if (jugadores.length === 0) return '<div class="empty-state">Todavía no hay jugadores cargados.</div>';
  const celda = (v, cls) => v === null
    ? `<td class="${cls} vacio">–</td>`
    : `<td class="${cls}">${fmt(v)}</td>`;

  const headDias = dias.map((d, i) => `
    <th colspan="3" class="dia-sep">Día ${i + 1}${multiplicadorDia(d) === 2 ? ' · x2' : ''}
      <span class="fmt">${FORMATOS[d.formato] || ''}</span></th>`).join('');
  const headSub = dias.map(() => `<th class="dia-sep">Indiv.</th><th>Parejas</th><th>Día</th>`).join('');

  const filas = tabla.map((r, i) => `
    <tr>
      <td class="pos"><span>${i + 1}</span></td>
      <td class="jug">${r.nombre}</td>
      ${r.detalle.map(d => {
        const sub = (d.ind === null && d.par === null) ? null : (d.ind || 0) + (d.par || 0);
        return celda(d.ind, 'ind dia-sep') + celda(d.par, 'par') + celda(sub, 'subt');
      }).join('')}
      <td class="total">${fmt(r.total)}</td>
    </tr>`).join('');

  const ultimo = dias.length;
  const filasLugar = PUNTOS_LUGAR.map((p, i) => `
    <tr class="${i === 0 ? 'top' : ''}"><td>${i + 1}°</td><td>${p}</td><td class="x2">${p * 2}</td></tr>`).join('');

  return `<div class="tabla-layout">
  <div class="card">
    <h3 class="serif" style="margin-bottom:12px;">Tabla General</h3>
    <div class="tabla-wrap">
      <table class="tg">
        <thead>
          <tr class="dias"><th></th><th class="jug"></th>${headDias}<th class="total"></th></tr>
          <tr><th></th><th class="jug">Jugador</th>${headSub}<th class="total">Total</th></tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
  </div>
  <div class="card reglas">
    <h4>Cómo se calculan los puntos</h4>
    <div class="sec">Individual · por lugar del día</div>
    <table class="pts">
      <thead><tr><th>Lugar</th><th>Días 1–${ultimo - 1}</th><th>Día ${ultimo} (x2)</th></tr></thead>
      <tbody>${filasLugar}</tbody>
    </table>
    <div class="sec">Match de parejas · a cada jugador</div>
    <table class="pts">
      <thead><tr><th>Resultado</th><th>Días 1–${ultimo - 1}</th><th>Día ${ultimo} (x2)</th></tr></thead>
      <tbody>
        <tr><td>Gana</td><td>${PUNTOS_PAREJA.gana}</td><td class="x2">${PUNTOS_PAREJA.gana * 2}</td></tr>
        <tr><td>Empate</td><td>${PUNTOS_PAREJA.empate}</td><td class="x2">${PUNTOS_PAREJA.empate * 2}</td></tr>
        <tr><td>Pierde</td><td>${PUNTOS_PAREJA.pierde}</td><td class="x2">${PUNTOS_PAREJA.pierde * 2}</td></tr>
      </tbody>
    </table>
    <p class="nota"><b>Empates en el individual:</b> se reparten los puntos de esos lugares.<br><b>Desempate final:</b> mejor resultado del Día ${ultimo}.</p>
  </div>
</div>`;
}

async function agregarJugador() {
  if (!esAdmin) return;
  const nombre = document.getElementById('nuevo-nombre').value.trim();
  if (!nombre) return;
  const { error } = await sb.from('jugadores').insert({ nombre, handicap: 0 });
  if (error) { toast('Error: ' + error.message); return; }
  toast('Jugador agregado');
  document.getElementById('nuevo-nombre').value = '';
  cargarTodo();
}
window.agregarJugador = agregarJugador;

async function quitarJugador(id) {
  if (!esAdmin) return;
  await sb.from('jugadores').delete().eq('id', id);
  for (const dia of dias) {
    const nuevosFoursomes = dia.foursomes.map(g => g.map(x => x === id ? '' : x));
    await sb.from('dias').update({ foursomes: nuevosFoursomes }).eq('id', dia.id);
  }
  cargarTodo();
}
window.quitarJugador = quitarJugador;

async function actualizarDia(diaId, campo, valor) {
  if (!esAdmin) return;
  await sb.from('dias').update({ [campo]: valor }).eq('id', diaId);
  cargarTodo();
}
window.actualizarDia = actualizarDia;

async function actualizarArrayDia(diaId, campo, indice, valor) {
  if (!esAdmin) return;
  const dia = dias.find(d => d.id === diaId);
  const arr = [...dia[campo]];
  arr[indice] = parseInt(valor) || (campo === 'pares' ? 4 : 1);
  await sb.from('dias').update({ [campo]: arr }).eq('id', diaId);
  cargarTodo();
}
window.actualizarArrayDia = actualizarArrayDia;

async function asignarFoursome(diaId, grupoIdx, slot, jugadorId) {
  if (!esAdmin) return;
  const dia = dias.find(d => d.id === diaId);
  const nuevosFoursomes = dia.foursomes.map(g => [...g]);
  nuevosFoursomes[grupoIdx][slot] = jugadorId;
  await sb.from('dias').update({ foursomes: nuevosFoursomes }).eq('id', diaId);
  cargarTodo();
}
window.asignarFoursome = asignarFoursome;

async function guardarScore(diaId, jugadorId, holeIdx, valor) {
  const sc = [...scoresDe(diaId, jugadorId)];
  sc[holeIdx] = valor === '' ? null : parseInt(valor);
  const id = diaId + '_' + jugadorId;
  const { error } = await sb.from('scores').upsert({ id, dia_id: diaId, jugador_id: jugadorId, scores: sc });
  if (error) { toast('Error al guardar score'); return; }
  cargarTodo();
}
window.guardarScore = guardarScore;

async function guardarGanadorPareja(parejaId, valor) {
  const { error } = await sb.from('parejas_dia').update({ ganador: valor || null }).eq('id', parejaId);
  if (error) { toast('Error al guardar'); return; }
  cargarTodo();
}
window.guardarGanadorPareja = guardarGanadorPareja;

async function actualizarHandicapDia(diaId, jugadorId, valor) {
  if (!esAdmin) return;
  const id = diaId + '_' + jugadorId;
  const handicap = parseFloat(valor) || 0;
  const { error } = await sb.from('handicaps').upsert({ id, dia_id: diaId, jugador_id: jugadorId, handicap });
  if (error) { toast('Error al guardar hándicap'); return; }
  cargarTodo();
}
window.actualizarHandicapDia = actualizarHandicapDia;

function toggleParesInput(diaId) {
  const el = document.getElementById('pares-' + diaId);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
window.toggleParesInput = toggleParesInput;

cargarTodo();
suscribirRealtime();
</script>
